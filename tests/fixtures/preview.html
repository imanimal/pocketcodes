<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PocketCodes preview</title>
<!-- The real popup or settings page (src/pages) with made-up accounts and codes, for looking at the design in any
     browser: serve the repo root, then open tests/fixtures/preview.html?page=popup (or page=options, and &empty for
     the first-run state, &builtin for a build with the built-in Google client, &off with the sign-in page chip turned
     off, &noaccess with its site access taken away). The extension API is a stand-in. -->
<link rel="stylesheet" href="../../src/pages/page.css">
<script>
  const q = new URLSearchParams(location.search);
  const page = q.get("page") || "popup", now = Date.now();
  const c = (n, code, from, email, ago, used) => ({ id: "g:s" + n, acct: "x", email, kind: "google", code, from, subject: "Your sign-in code", at: now - ago, found: now, seen: true, used: !!used });
  const store = q.has("empty") ? { settings: { page: !q.has("off") } } : {
    accounts: [{ id: "google:you@example.com", kind: "google", email: "you@example.com" }, { id: "imap:you@icloud.example", kind: "imap", label: "iCloud", email: "you@icloud.example" }],
    "st:google:you@example.com": { ok: true, at: now - 30e3 }, "st:imap:you@icloud.example": { ok: true, at: now - 50e3 },
    meta: { lastPoll: now - 20e3 }, settings: { page: !q.has("off") },
    authenticators: [{ id: "totp:github.com:octocat", name: "GitHub", site: "github.com", label: "octocat", digits: 6, period: 30 }],
    codes: [c(1, "482913", "GitHub", "you@example.com", 40e3), c(2, "73520118", "Example Bank", "you@icloud.example", 4 * 60e3), c(3, "246810", "Discord", "you@example.com", 50 * 60e3, true)],
  };
  window.browser = {
    storage: { local: {
      get: async (k) => { const ks = k == null ? Object.keys(store) : Array.isArray(k) ? k : [k]; return Object.fromEntries(ks.filter((x) => x in store).map((x) => [x, store[x]])); },
      set: async (o) => Object.assign(store, o), remove: async () => {},
    }, onChanged: { addListener() {} } },
    runtime: { sendMessage: async (m) => (m.type === "helper" ? { ok: true, helper: { version: "0.2.0", os: "Windows", totp: true, texts: false } }
      : m.type === "totp" ? { ok: true, codes: (store.authenticators || []).map((t, i) => Object.assign({ code: ["908172", "315264"][i % 2], left: 17 }, t)) } : { ok: true }), getURL: (p) => p },
    identity: { getRedirectURL: () => "https://0123456789abcdef.extensions.allizom.org/" },
    tabs: { create: async () => {}, query: async () => [] },
    permissions: { contains: async () => !q.has("noaccess"), request: async () => true, remove: async () => true },
  };
  document.documentElement.dataset.page = page;
</script>
</head>
<body>
<div id="app"></div>
<div id="msg" hidden></div>
<script>
  const load = (src) => new Promise((r) => { const s = document.createElement("script"); s.src = src + "?v=" + Date.now(); s.onload = r; document.body.append(s); });
  (async () => {
    if (page === "options") {
      document.body.className = "options";
      const band = document.createElement("div"); band.className = "band top"; band.innerHTML = '<span class="label">Pocket<i>codes</i> · Settings</span>';
      document.body.prepend(band);
      document.getElementById("app").className = "wrap";
    } else document.body.className = "popup";
    await load("../../src/lib/util.js");
    await load("../../src/lib/client.js");
    if (q.has("builtin")) PC.CLIENT.google = { id: "preview", secret: "preview" };
    if (page === "options") { await load("../../src/lib/imap.js"); await load("../../src/lib/texts.js"); }
    await load(`../../src/pages/${page}.js`);
  })();
</script>
</body>
</html>
